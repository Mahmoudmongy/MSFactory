services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openbooks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbooks_dev_pw}
      POSTGRES_DB: openbooks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbooks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      OPENBOOKS_ENVIRONMENT: production
      OPENBOOKS_SECRET_KEY: ${OPENBOOKS_SECRET_KEY:?set a strong secret}
      OPENBOOKS_DATABASE_URL: postgresql+psycopg://openbooks:${POSTGRES_PASSWORD:-openbooks_dev_pw}@db:5432/openbooks
      OPENBOOKS_REDIS_URL: redis://redis:6379/0
      OPENBOOKS_CORS_ORIGINS: ${OPENBOOKS_CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
