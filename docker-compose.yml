services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: msfactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-msfactory_dev_pw}
      POSTGRES_DB: msfactory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msfactory"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      MSFACTORY_ENVIRONMENT: production
      MSFACTORY_SECRET_KEY: ${MSFACTORY_SECRET_KEY:?set a strong secret}
      MSFACTORY_DATABASE_URL: postgresql+psycopg://msfactory:${POSTGRES_PASSWORD:-msfactory_dev_pw}@db:5432/msfactory
      MSFACTORY_REDIS_URL: redis://redis:6379/0
      MSFACTORY_CORS_ORIGINS: ${MSFACTORY_CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
