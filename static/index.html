<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>OpenBooks — محاسبة أونلاين</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/static/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- Login -->
  <section id="login">
    <form class="box" id="login-form">
      <div class="logo">₪</div>
      <h1>OpenBooks</h1>
      <p class="sub">نظام محاسبة متكامل على الموبايل</p>
      <label for="username">اسم المستخدم</label>
      <input id="username" autocomplete="username" value="admin" required />
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" value="admin123" required />
      <button class="btn" type="submit">تسجيل الدخول</button>
      <p class="sub" style="margin-top:14px">افتراضي: admin / admin123</p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <h2 id="page-title">لوحة التحكم</h2>
      <button class="icon-btn" id="logout-btn" title="خروج">⎋</button>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button data-route="dashboard" class="active"><span class="ico">▦</span>الرئيسية</button>
      <button data-route="invoices"><span class="ico">🧾</span>الفواتير</button>
      <button data-route="payments"><span class="ico">💵</span>المدفوعات</button>
      <button data-route="contacts"><span class="ico">👥</span>العملاء</button>
      <button data-route="reports"><span class="ico">📊</span>التقارير</button>
      <button data-route="more"><span class="ico">⋯</span>المزيد</button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
