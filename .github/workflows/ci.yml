name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks_test_pw
          POSTGRES_DB: openbooks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openbooks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENBOOKS_DATABASE_URL: postgresql+psycopg://openbooks:openbooks_test_pw@localhost:5432/openbooks_test
      OPENBOOKS_REDIS_URL: redis://localhost:6379/0
      OPENBOOKS_SECRET_KEY: ci-only-secret
      OPENBOOKS_LOGIN_RATE_LIMIT_PER_MINUTE: "1000"
      OPENBOOKS_RATE_LIMIT_PER_MINUTE: "5000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
