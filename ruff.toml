line-length = 120
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "DTZ", "RUF"]
ignore = [
    # FastAPI expresses dependency injection as function calls in defaults.
    "B008",
    # Middleware intentionally fails open when Redis is unreachable.
    "BLE001",
]

[lint.per-file-ignores]
"tests/*" = ["E501"]

[lint.isort]
known-first-party = ["app"]
